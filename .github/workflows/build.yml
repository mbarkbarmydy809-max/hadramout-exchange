name: Publish Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: 'public/app.apk'
        

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install -g pnpm
        pnpm install

    - name: Build Web App
      run: pnpm build || npm run build || true

    - name: Sync Capacitor
      run: |
        npx cap add android || true
        npx cap sync android || true

    - name: Build Android APK
      run: |
        GRADLE_DIR=$(dirname $(find . -name "gradlew" -not -path "*/.*" | head -n 1))
        if [ -n "$GRADLE_DIR" ]; then
          echo "Found gradlew in $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease
        else
          echo "No gradlew found, building with gradle directly..."
          cd android
          gradle assembleRelease
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: '**/build/outputs/apk/release/*.apk'
        

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install -g pnpm @capacitor/cli @capacitor/core
        pnpm install --no-frozen-lockfile

    - name: Build Main Web App
      run: |
        npx vite build --emptyOutDir || pnpm run --filter . build || npm run build || true

    - name: Initialize & Add Android Project
      run: |
        npx cap init "Hadramout Exchange" "com.hadramout.exchange" --web-dir dist || true
        npx cap add android || true
        npx cap sync android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: 'android/app/build/outputs/apk/release/app-release-unsigned.apk'
        

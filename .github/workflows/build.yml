name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install -g pnpm
        pnpm install --no-frozen-lockfile

    - name: Build Web Application
      run: |
        # بناء الويب للمشروع الأساسي
        pnpm build || npm run build || npx vite build

    - name: Inject Web Assets to Android Assets
      run: |
        # إنشاء المجلد المباشر للأندرويد
        mkdir -p android/app/src/main/assets/public

        # البحث عن المجلد المجمع (dist أو build) ونسخ محتوياته
        if [ -d "dist" ]; then
          cp -r dist/* android/app/src/main/assets/public/
        elif [ -d "build" ]; then
          cp -r build/* android/app/src/main/assets/public/
        fi

        # طباعة المحتويات للتحقق
        ls -la android/app/src/main/assets/public/

    - name: Setup Gradle Wrapper & Build APK
      run: |
        cd android
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: '**/build/outputs/apk/**/*.apk'
        

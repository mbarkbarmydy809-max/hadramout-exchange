name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install -g pnpm @capacitor/cli @capacitor/core
        pnpm install --no-frozen-lockfile

    - name: Build Web Assets
      run: |
        pnpm run build || npm run build || true
        # إنشاء مجلد dist احتياطي وتمرير الملفات إليه لضمان وجوده
        mkdir -p dist
        if [ -d "build" ]; then cp -r build/* dist/; fi
        if [ -d "public" ]; then cp -r public/* dist/; fi

    - name: Sync Capacitor Android
      run: |
        # التأكد من مطابقة إعدادات Capacitor لمجلد dist
        npx cap sync android || npx cap add android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: 'android/app/build/outputs/apk/release/*.apk'
        

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install -g pnpm @capacitor/cli @capacitor/core
        pnpm install --no-frozen-lockfile

    - name: Prepare Web Assets
      run: |
        # تشغيل عملية البناء
        pnpm run build || npm run build || true

        # البحث عن ملف index.html المجمع ونقل المحتويات
        INDEX_PATH=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/android/*" | head -n 1)
        
        mkdir -p dist
        if [ -n "$INDEX_PATH" ]; then
          BUILD_DIR=$(dirname "$INDEX_PATH")
          echo "Found build dir at: $BUILD_DIR"
          cp -r "$BUILD_DIR"/* dist/
        fi

        # النسخ المباشر لملفات الويب إلى مشروع الأندرويد
        mkdir -p android/app/src/main/assets/public
        cp -r dist/* android/app/src/main/assets/public/

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: '**/build/outputs/apk/release/*.apk'
       
